name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Check licenses
        run: cmake -P cmake/check_licenses.cmake
      - name: Restore static OCCT 7.6.0
        id: occt-cache
        uses: actions/cache@v5
        with:
          path: .ci/occt-install
          key: occt-7.6.0-static-${{ runner.os }}-v3
      - name: Checkout OCCT 7.6.0
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: Open-Cascade-SAS/OCCT
          ref: V7_6_0
          path: .ci/occt-source
      - name: Build static OCCT 7.6.0
        if: steps.occt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./.github/scripts/build-occt.ps1
      - name: Configure
        shell: pwsh
        run: |
          $arguments = @(
            "-S", ".",
            "-B", "build",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DGMESH_BUILD_TESTS=ON",
            "-DGMESH_WARNINGS_AS_ERRORS=ON",
            "-DGMESH_ENABLE_STEP=ON",
            "-DOpenCASCADE_DIR=${{ github.workspace }}/.ci/occt-install/cmake"
          )
          cmake @arguments
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify macOS universal binary
        if: runner.os == 'macOS'
        run: |
          lipo build/src/gmesh -info
          lipo build/src/gmesh -verify_arch arm64 x86_64
      - name: Stage distribution metadata
        run: |
          cmake -E make_directory artifact
          cmake -E copy LICENSE NOTICE.md THIRD_PARTY_LICENSES.md artifact
          cmake -E copy_directory LICENSES artifact/LICENSES
      - name: Stage Windows executable
        if: runner.os == 'Windows'
        run: cmake -E copy build/src/Release/gmesh.exe artifact/gmesh.exe
      - name: Stage Unix executable
        if: runner.os != 'Windows'
        run: cmake -E copy build/src/gmesh artifact/gmesh
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: gmesh-windows-x64
          path: artifact
          if-no-files-found: error
      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: gmesh-linux-x64
          path: artifact
          if-no-files-found: error
      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: gmesh-macos-universal2
          path: artifact
          if-no-files-found: error
